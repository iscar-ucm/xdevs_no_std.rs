name: Kani

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify proofs
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: "0.68.0"
          args: --features alloc --output-format terse
